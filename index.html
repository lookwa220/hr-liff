<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HR Leave System</title>

  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #profileImage {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: none;
      margin: 15px auto;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
      line-height: 1.6;
    }

    #employeeInfo {
      display: none;
      margin-top: 20px;
      line-height: 1.8;
    }

    #registerBox {
      display: none;
      margin-top: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #06C755;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .small {
      font-size: 12px;
      color: #777;
      word-break: break-all;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>ระบบ HR ออนไลน์</h2>

    <div id="status">
      กำลังเริ่มต้นระบบ...
    </div>

    <img id="profileImage" alt="LINE Profile">

    <h3 id="displayName"></h3>

    <div id="employeeInfo"></div>

    <div id="registerBox">
      <h3>ลงทะเบียนครั้งแรก</h3>

      <p>
        กรุณากรอกรหัสพนักงานของคุณ
      </p>

      <input
        id="empIdInput"
        type="text"
        placeholder="เช่น 2011393"
      >

      <button
        id="registerBtn"
        onclick="registerEmployee()">
        ลงทะเบียน
      </button>
    </div>

    <div
      id="lineUserIdDisplay"
      class="small">
    </div>

  </div>


  <script>

    const LIFF_ID =
      "2011799105-A1YwHp4u";

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxB8jCDzKtqrMs0BPCDyeXhSOocRVFRuRLp7OyTR_JKOZMcm0ueEWTOinoky4GQ_x16/exec";

    let currentLineUserId = "";


    async function startApp() {

      const status =
        document.getElementById("status");

      try {

        status.innerText =
          "กำลังเชื่อมต่อ LINE...";

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {

          liff.login();
          return;

        }

        const profile =
          await liff.getProfile();

        currentLineUserId =
          profile.userId;

        document.getElementById(
          "displayName"
        ).innerText =
          profile.displayName;

        if (profile.pictureUrl) {

          const img =
            document.getElementById(
              "profileImage"
            );

          img.src =
            profile.pictureUrl;

          img.style.display =
            "block";
        }

        document.getElementById(
          "lineUserIdDisplay"
        ).innerText =
          "LINE User ID: " +
          currentLineUserId;

        await checkEmployee();

      } catch (error) {

        status.innerHTML =
          "❌ เกิดข้อผิดพลาด<br>" +
          error.message;

        console.error(error);
      }
    }


    async function checkEmployee() {

      const status =
        document.getElementById("status");

      status.innerText =
        "กำลังตรวจสอบข้อมูลพนักงาน...";

      try {

        const url =
          API_URL +
          "?action=check" +
          "&lineUserId=" +
          encodeURIComponent(
            currentLineUserId
          );

        const response =
          await fetch(url);

        const result =
          await response.json();

        if (
          result.success &&
          result.data &&
          result.data.found
        ) {

          showEmployee(
            result.data
          );

        } else {

          status.innerText =
            "ยังไม่พบการลงทะเบียน";

          document.getElementById(
            "registerBox"
          ).style.display =
            "block";
        }

      } catch (error) {

        status.innerHTML =
          "❌ เชื่อมต่อฐานข้อมูลไม่ได้<br>" +
          error.message;

        console.error(error);
      }
    }


    async function registerEmployee() {

      const empId =
        document.getElementById(
          "empIdInput"
        ).value.trim();

      const status =
        document.getElementById("status");

      const btn =
        document.getElementById(
          "registerBtn"
        );

      if (!empId) {

        alert(
          "กรุณากรอกรหัสพนักงาน"
        );

        return;
      }

      btn.disabled = true;

      status.innerText =
        "กำลังลงทะเบียน...";

      try {

        const url =
          API_URL +
          "?action=register" +
          "&empId=" +
          encodeURIComponent(empId) +
          "&lineUserId=" +
          encodeURIComponent(
            currentLineUserId
          );

        const response =
          await fetch(url);

        const result =
          await response.json();

        if (result.success) {

          status.innerText =
            "✅ ลงทะเบียนสำเร็จ";

          document.getElementById(
            "registerBox"
          ).style.display =
            "none";

          await checkEmployee();

        } else {

          status.innerText =
            "❌ " +
            (
              result.error ||
              "ลงทะเบียนไม่สำเร็จ"
            );
        }

      } catch (error) {

        status.innerHTML =
          "❌ เกิดข้อผิดพลาด<br>" +
          error.message;

        console.error(error);

      } finally {

        btn.disabled = false;
      }
    }


    function showEmployee(data) {

      document.getElementById(
        "status"
      ).innerText =
        "✅ พบข้อมูลพนักงาน";

      const box =
        document.getElementById(
          "employeeInfo"
        );

      box.style.display =
        "block";

      box.innerHTML =
        "<b>รหัสพนักงาน:</b> " +
        data.empId +
        "<br>" +
        "<b>ชื่อ:</b> " +
        data.name +
        "<br>" +
        "<b>วันลาคงเหลือ:</b> " +
        (
          data.quota === "" ||
          data.quota === undefined
            ? "-"
            : data.quota
        );
    }


    startApp();

  </script>

</body>
</html>
