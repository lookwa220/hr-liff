<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HR Leave System</title>

  <!-- LINE LIFF SDK -->
  <script
    charset="utf-8"
    src="https://static.line-scdn.net/liff/edge/2/sdk.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    #profileImage {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: none;
      margin: 15px auto;
      object-fit: cover;
    }

    #status {
      margin-top: 15px;
      font-size: 16px;
      line-height: 1.6;
    }

    #employeeInfo {
      display: none;
      margin-top: 20px;
      line-height: 1.8;
      font-size: 17px;
    }

    #registerBox {
      display: none;
      margin-top: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #06C755;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .small {
      font-size: 12px;
      color: #777;
      word-break: break-all;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>ระบบ HR ออนไลน์</h2>

    <div id="status">
      กำลังเริ่มต้นระบบ...
    </div>

    <img
      id="profileImage"
      alt="LINE Profile"
    >

    <h3 id="displayName"></h3>

    <div id="employeeInfo"></div>

    <div id="registerBox">

      <h3>ลงทะเบียนครั้งแรก</h3>

      <p>
        กรุณากรอกรหัสพนักงานของคุณ
      </p>

      <input
        id="empIdInput"
        type="text"
        inputmode="numeric"
        placeholder="เช่น 2011393"
      >

      <button
        id="registerBtn"
        onclick="registerEmployee()">
        ลงทะเบียน
      </button>

    </div>

    <div
      id="lineUserIdDisplay"
      class="small">
    </div>

  </div>


  <script>

    // ==============================
    // ตั้งค่า LIFF
    // ==============================

    const LIFF_ID =
      "2011799105-A1YwHp4u";


    // ==============================
    // Google Apps Script API
    // ==============================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxB8jCDzKtqrMs0BPCDyeXhSOocRVFRuRLp7OyTR_JKOZMcm0ueEWTOinoky4GQ_x16/exec";


    // เก็บ LINE User ID ของผู้ใช้งานปัจจุบัน
    let currentLineUserId = "";


    // ==============================
    // เริ่มระบบ
    // ==============================

    async function startApp() {

      const status =
        document.getElementById("status");

      try {

        status.innerText =
          "กำลังเชื่อมต่อ LINE...";


        // เริ่ม LIFF
        await liff.init({
          liffId: LIFF_ID
        });


        // ถ้ายังไม่ได้ล็อกอิน
        if (!liff.isLoggedIn()) {

          liff.login();
          return;
        }


        // อ่านข้อมูล Profile จาก LINE
        const profile =
          await liff.getProfile();


        currentLineUserId =
          profile.userId;


        // แสดงชื่อ LINE
        document.getElementById(
          "displayName"
        ).innerText =
          profile.displayName;


        // แสดงรูป Profile
        if (profile.pictureUrl) {

          const img =
            document.getElementById(
              "profileImage"
            );

          img.src =
            profile.pictureUrl;

          img.style.display =
            "block";
        }


        // แสดง LINE User ID
        document.getElementById(
          "lineUserIdDisplay"
        ).innerText =
          "LINE User ID: " +
          currentLineUserId;


        // ตรวจสอบพนักงาน
        checkEmployee();


      } catch (error) {

        status.innerHTML =
          "❌ เกิดข้อผิดพลาด<br>" +
          error.message;

        console.error(error);
      }
    }


    // ==============================
    // ตรวจสอบว่า LINE นี้ลงทะเบียนหรือยัง
    // ==============================

    function checkEmployee() {

      const status =
        document.getElementById("status");

      status.innerText =
        "กำลังตรวจสอบข้อมูลพนักงาน...";


      jsonpRequest({
        action: "check",
        lineUserId: currentLineUserId
      })
      .then(function(result) {

        console.log(
          "checkEmployee result:",
          result
        );


        // ถ้าพบพนักงาน
        if (
          result &&
          result.success &&
          result.data &&
          result.data.found
        ) {

          document.getElementById(
            "registerBox"
          ).style.display =
            "none";

          showEmployee(
            result.data
          );

        }

        // ถ้ายังไม่พบ
        else {

          document.getElementById(
            "employeeInfo"
          ).style.display =
            "none";

          status.innerText =
            "ยังไม่พบการลงทะเบียน";

          document.getElementById(
            "registerBox"
          ).style.display =
            "block";
        }

      })
      .catch(function(error) {

        status.innerHTML =
          "❌ เชื่อมต่อฐานข้อมูลไม่ได้<br>" +
          error.message;

        console.error(error);
      });
    }


    // ==============================
    // ลงทะเบียนพนักงานครั้งแรก
    // ==============================

    function registerEmployee() {

      const empId =
        document.getElementById(
          "empIdInput"
        ).value.trim();


      const status =
        document.getElementById(
          "status"
        );


      const btn =
        document.getElementById(
          "registerBtn"
        );


      // ยังไม่ได้กรอกรหัสพนักงาน
      if (!empId) {

        alert(
          "กรุณากรอกรหัสพนักงาน"
        );

        return;
      }


      btn.disabled = true;

      status.innerText =
        "กำลังลงทะเบียน...";


      jsonpRequest({
        action: "register",
        empId: empId,
        lineUserId: currentLineUserId
      })
      .then(function(result) {

        console.log(
          "registerEmployee result:",
          result
        );


        // ลงทะเบียนสำเร็จ
        if (
          result &&
          result.success
        ) {

          status.innerText =
            "✅ ลงทะเบียนสำเร็จ";


          document.getElementById(
            "registerBox"
          ).style.display =
            "none";


          // ตรวจข้อมูลใหม่อีกรอบ
          return checkEmployee();

        }


        // ลงทะเบียนไม่สำเร็จ
        else {

          status.innerText =
            "❌ " +
            (
              result.error ||
              "ลงทะเบียนไม่สำเร็จ"
            );
        }

      })
      .catch(function(error) {

        status.innerHTML =
          "❌ เกิดข้อผิดพลาด<br>" +
          error.message;

        console.error(error);

      })
      .finally(function() {

        btn.disabled = false;

      });
    }


    // ==============================
    // แสดงข้อมูลพนักงาน
    // ==============================

    function showEmployee(data) {

      document.getElementById(
        "status"
      ).innerText =
        "✅ พบข้อมูลพนักงาน";


      const box =
        document.getElementById(
          "employeeInfo"
        );


      box.style.display =
        "block";


      const quotaValue =
        (
          data.quota === "" ||
          data.quota === null ||
          data.quota === undefined
        )
        ? "-"
        : data.quota;


      box.innerHTML =
        "<b>รหัสพนักงาน:</b> " +
        data.empId +
        "<br>" +

        "<b>ชื่อ:</b> " +
        data.name +
        "<br>" +

        "<b>วันลาคงเหลือ:</b> " +
        quotaValue;
    }


    // ==============================
    // JSONP
    // ใช้แทน fetch เพื่อหลบปัญหา
    // redirect / HTML response
    // จาก Apps Script
    // ==============================

    function jsonpRequest(params) {

      return new Promise(
        function(resolve, reject) {


          const callbackName =
            "jsonpCallback_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 100000
            );


          const script =
            document.createElement(
              "script"
            );


          const query =
            new URLSearchParams(
              params
            );


          query.append(
            "callback",
            callbackName
          );


          // ตั้งเวลาหมดอายุ 15 วินาที
          const timeout =
            setTimeout(
              function() {

                cleanup();

                reject(
                  new Error(
                    "เชื่อมต่อเซิร์ฟเวอร์หมดเวลา"
                  )
                );

              },
              15000
            );


          // ฟังก์ชัน Callback
          window[callbackName] =
            function(data) {

              clearTimeout(
                timeout
              );

              cleanup();

              resolve(data);
            };


          // ล้าง script และ callback
          function cleanup() {

            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );
            }

            delete window[
              callbackName
            ];
          }


          // ถ้าโหลด API ไม่สำเร็จ
          script.onerror =
            function() {

              clearTimeout(
                timeout
              );

              cleanup();

              reject(
                new Error(
                  "ไม่สามารถโหลดข้อมูลจากเซิร์ฟเวอร์ได้"
                )
              );
            };


          // สร้าง URL
          script.src =
            API_URL +
            "?" +
            query.toString();


          // ส่ง request
          document.body
            .appendChild(
              script
            );

        }
      );
    }


    // ==============================
    // เริ่มทำงาน
    // ==============================

    startApp();

  </script>

</body>
</html>
